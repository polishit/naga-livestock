# Production stack for a single VPS: Caddy (HTTPS + static PWA) → API → MySQL 8, with MinIO for uploads.
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
# In CI-driven deploys, API_IMAGE / WEB_IMAGE point at the images pushed to GHCR.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: livestock
      MYSQL_USER: livestock
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      TZ: Asia/Manila
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job that creates the private uploads bucket.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS} &&
      mc mb --ignore-existing local/$${BUCKET} && mc anonymous set none local/$${BUCKET}"
    environment:
      MINIO_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_PASS: ${S3_SECRET_KEY}
      BUCKET: ${S3_BUCKET:-livestock}
    restart: 'no'

  api:
    image: ${API_IMAGE:-naga-livestock-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://livestock:${MYSQL_PASSWORD}@mysql:3306/livestock
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      COOKIE_SECURE: 'true'
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-livestock}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TZ: Asia/Manila
    expose:
      - '4000'

  web:
    image: ${WEB_IMAGE:-naga-livestock-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  minio_data:
  caddy_data:
  caddy_config:
